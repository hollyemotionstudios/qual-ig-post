<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Post</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400&family=Inter:wght@400;500&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  /* Built from Figma file jO4VrQnb9mAVd7SkmDKv9Y, frames "IG Posting 1" (2165:56), "IG Posting 2" (7:1308)
     and "Sharing the post with others" (9:3013), all 523×847. Everything below is in Figma px;
     JS scales the whole stage to fit the screen width, and on taller screens makes the stage taller (see fit()). */
  :root {
    --black: #000;
    --story-bg: #141112;
    --box: #252528;
    --blue: #2695e9;
    --like: #ff3040;
    /* Emoji in any text (comments, caption) use Google's Noto Color Emoji (OFL, commercial-safe), not the device's own. */
    --sans: Aptos, "Albert Sans", "Noto Color Emoji", system-ui, sans-serif;
    --ui: Inter, "Noto Color Emoji", system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* overflow: clip (not just hidden) so the browser can't scroll the page to reveal the caption under the keyboard. */
  html, body {
    height: 100%; overflow: hidden; overflow: clip; overscroll-behavior: none;
    background: var(--black); color: #fff;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    transition: background-color .3s;
  }
  body { position: fixed; inset: 0; }
  body.on-story { background: var(--story-bg); }
  img { display: block; pointer-events: none; -webkit-user-drag: none; }
  button { all: unset; cursor: pointer; display: grid; place-items: center; }

  #stage {
    position: absolute; left: 0; top: 0;
    width: 523px; height: 847px;
    transform-origin: 0 0;
  }
  .screen {
    position: absolute; inset: 0;
    transition: opacity .32s var(--ease), transform .32s var(--ease);
  }
  .screen[hidden] { display: block; opacity: 0; pointer-events: none; transform: scale(.97); }

  /* ---------- post (IG Posting 1 / 2) ---------- */
  #post { background: var(--black); }
  .user {
    position: absolute; display: flex; align-items: center; gap: 10px;
    font: 400 14px/1 var(--ui); white-space: nowrap;
  }
  .user .av { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .user .when { color: rgba(255,255,255,.6); margin-left: 2px; }
  /* Attached song under the username, with a small animated waveform (like Instagram). */
  .user .who { display: flex; flex-direction: column; gap: 4px; }
  .user .song { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,.92); }
  .wave { display: flex; align-items: center; gap: 2px; height: 12px; }
  .wave b { width: 2px; height: 100%; border-radius: 1px; background: currentColor; transform-origin: 50% 50%; animation: wave .9s ease-in-out infinite alternate; }
  .wave b:nth-child(1) { animation-duration: .7s; }
  .wave b:nth-child(2) { animation-duration: .5s; animation-delay: -.2s; }
  .wave b:nth-child(3) { animation-duration: .8s; animation-delay: -.4s; }
  .wave b:nth-child(4) { animation-duration: .6s; animation-delay: -.1s; }
  @keyframes wave { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
  #story .user { text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  #post .user { left: 40px; top: 27px; padding: 10px; margin: -10px; }   /* hidden button: fills the caption */

  .col {
    position: absolute; left: 22px; top: 76px; width: 476px; bottom: 0;
    display: flex; flex-direction: column;
  }
  .photo {
    flex: 1 1 auto; min-height: 0; border-radius: 24px; overflow: hidden; background: #111;
  }
  .photo img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%;
    transition: object-position .34s var(--ease);
  }
  .gap { flex: none; height: 38px; transition: height .34s var(--ease); }
  .box {
    flex: none; position: relative; margin: 0 -4px;
    min-height: 117px; padding: 20px 64px 19px 20px;
    background: var(--box); border-radius: 24px; cursor: text;
  }
  .box textarea {
    display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent;
    color: #fff; caret-color: var(--blue);
    font: 400 26px/39px var(--sans); letter-spacing: 0;
    height: 78px; max-height: 156px; overflow-y: auto; scrollbar-width: none;
    -webkit-user-select: text; user-select: text;
  }
  .box textarea::-webkit-scrollbar { display: none; }
  .send {
    position: absolute; right: 14px; bottom: 22px; width: 48px; height: 48px; border-radius: 50%;
    transition: transform .15s;
  }
  .send:active { transform: scale(.88); }
  .send svg { width: 24.4px; height: 24.4px; }
  .spacer { flex: none; height: 36px; transition: height .34s var(--ease); }

  #post.editing .gap { height: 24px; }
  /* Until the real keyboard is measured, assume the Figma "IG Posting 2" space (359px); see keyboardSpace() */
  #post.editing .spacer { height: 359px; }
  #post.editing .photo img { object-position: 50% 0%; }   /* keep the top of the photo as it shrinks */

  /* ---------- story (Sharing the post with others) ---------- */
  /* The strip above the photo (0–55px) is left empty for the device's own status bar. */
  #story { background: var(--story-bg); }
  #inset { position: fixed; top: 0; height: 0; padding-top: env(safe-area-inset-top, 0px); visibility: hidden; }

  .frame {
    position: absolute; left: 16px; top: 55px; width: 492px; bottom: 98px;
    border-radius: 24px; overflow: hidden; background: #111;
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
  /* Dark fade behind the progress bar, username and song so they read over a bright photo. */
  .frame::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 150px;
    background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.28) 45%, rgba(0,0,0,0));
  }
  .bars { position: absolute; left: 40px; top: 61px; width: 450px; height: 2px; display: flex; gap: 6px; z-index: 1; }
  .bars span { flex: 1; border-radius: 1px; background: rgba(255,255,255,.35); overflow: hidden; }
  .bars i { display: block; height: 100%; width: 0; background: #fff; }
  #story.play .bars i { width: 100%; transition: width var(--story-time, 6s) linear; }

  #story .user { left: 36px; top: 75px; z-index: 1; }
  .more { position: absolute; left: 420px; top: 80px; width: 24px; height: 24px; z-index: 1; }
  .close { position: absolute; left: 446px; top: 70px; width: 44px; height: 44px; z-index: 1; }
  .close svg { width: 20px; height: 20px; }

  .reply {
    position: absolute; left: 28px; bottom: 29px; width: 372px; height: 40px;
    border: 1px solid rgba(255,255,255,.55); border-radius: 20px;
    padding-left: 17px; display: flex; align-items: center;
    font: 400 16px/1 var(--ui);
  }
  .heart { position: absolute; left: 406px; bottom: 27px; width: 44px; height: 44px; }
  .heart svg { width: 22.5px; height: 20px; overflow: visible; }
  .heart path { transition: fill .15s, stroke .15s; }
  .heart.on path { fill: var(--like); stroke: var(--like); }
  .heart.on svg { animation: pop .35s var(--ease); }
  @keyframes pop { 40% { transform: scale(1.3); } }
  .share { position: absolute; left: 445px; bottom: 22px; width: 44px; height: 44px; }
  .share svg { width: 21.9px; height: 19.4px; overflow: visible; }
  /* ---------- live reactions on the story ---------- */
  /* Comments rise up the lower part of the photo, newest at the bottom: 3 rows show, a 4th fades out at the top. */
  .shade {
    position: absolute; inset: auto 0 0 0; height: 330px;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.45));
  }
  .comments {
    position: absolute; left: 30px; bottom: 110px; width: 350px; height: 216px; z-index: 1;
    overflow: hidden; pointer-events: none;
    -webkit-mask-image: linear-gradient(transparent, #000 54px); mask-image: linear-gradient(transparent, #000 54px);
  }
  .comments ol { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 0; list-style: none; }
  .comments li { display: flex; align-items: center; gap: 12px; padding-top: 14px; }
  .comments img { flex: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #333; }
  .comments p { margin: 0; min-width: 0; font: 400 15px/19px var(--ui); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .comments b { display: block; font-weight: 600; font-size: 14px; }

  /* The typed caption as a story text sticker: black on white, each line on its own rounded block. */
  .story-caption {
    position: absolute; left: 32px; bottom: 395px; width: 460px; z-index: 1;
    transform: translateY(50%); text-align: center; text-wrap: balance; pointer-events: none;
  }
  .story-caption span {
    background: #fff; color: #000; font: 600 28px/1.45 var(--ui);
    padding: 4px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }

  /* Emoji reactions float up from the like button. */
  .hearts { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .hearts img { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
</style>
</head>

<div id="stage">

        </button>

  </section>

  <section id="story" class="screen" hidden>
    <div class="frame"><img src="assets/photo.jpg" alt=""><div class="shade"></div></div>
    <div class="comments" aria-hidden="true"><ol id="comments"></ol></div>
    <div class="story-caption"><span id="storyCaption"></span></div>
    <div class="bars"><span><i></i></span></div>
    <div class="user">
      <img class="av" src="assets/avatar.jpg" alt="">
      <span class="who">
        <span>Kimiantonelli <span class="when">18h</span></span>
        <span class="song"><i class="wave"><b></b><b></b><b></b><b></b></i>Hark Madley • Jamme, Jamme</span>
      </span>
    </div>
    <div class="more"><svg style="position:absolute;left:5px;top:10.5px" width="14" height="3" viewBox="0 0 14 3"><circle cx="1.5" cy="1.5" r="1.5" fill="#fff"/><circle cx="7" cy="1.5" r="1.5" fill="#fff"/><circle cx="12.5" cy="1.5" r="1.5" fill="#fff"/></svg></div>
    <button class="close" id="close" aria-label="Close">
      <svg viewBox="0 0 20 20" fill="none"><path d="M1 1L19 19M19 1L1 19" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="reply">Send message</div>
    <div class="hearts" id="hearts" aria-hidden="true"></div>
    <button class="heart" id="heart" aria-label="Like">
      <svg viewBox="0 0 22.4996 20.0004" fill="none"><path d="M13.002 2.42676C14.8649 0.732937 17.2779 0.459446 19.0996 1.55469C21.0143 2.70675 22.0205 5.17248 21.4326 7.53906V7.54004C20.8747 9.78771 19.5094 11.6029 17.8506 13.3975C15.8957 15.5122 13.6309 17.2977 11.2539 19.0283C8.20074 16.7958 5.32529 14.5207 3.12109 11.5801L2.67676 10.9648L2.30469 10.4072C1.47642 9.10259 0.930513 7.76852 0.901367 6.28809C0.858732 4.12604 2.0417 2.18801 3.76465 1.35742L3.93262 1.28027C5.74193 0.499061 8.00088 0.953862 9.6416 2.56152C9.96337 2.877 10.2943 3.19503 10.6641 3.55371L11.3145 4.18359L11.9404 3.53027C12.2561 3.20101 12.4912 2.93051 12.7422 2.67676L13.002 2.42676Z" stroke="#fff" stroke-width="1.8"/></svg>

<script>
  // URL options: ?text=…  pre-fills the caption (empty by default)
  //              ?story=6  seconds for the story progress bar
  //              ?screen=story  opens straight on the shared screen
  const DEFAULT_TEXT = "";
  const STORY_DEFAULT = "Jamme jamme, let's go to the top!";   // shown on the story when no caption was typed

  const q = new URLSearchParams(location.search);
  const startText = q.has("text") ? q.get("text") : DEFAULT_TEXT;
  if (q.has("story")) document.documentElement.style.setProperty("--story-time", (+q.get("story") || 6) + "s");

  const stage = document.getElementById("stage");
  const post = document.getElementById("post");
  const story = document.getElementById("story");
  const box = document.getElementById("box");
  const caption = document.getElementById("caption");
  const heart = document.getElementById("heart");
  const spacer = post.querySelector(".spacer");

  // Scale the 523×847 design to fit. While typing, the on-screen keyboard shrinks the viewport,
  // so the scale is frozen until editing ends.
  // If the page is drawn under the device's status bar (safe-area inset), the post header
  // (27px down in Figma) is kept at least 6px below it; the shared screen's empty 55px strip
  // then holds the bar.
  const insetEl = document.getElementById("inset");
  let editing = false;
  // Screens taller than 523×847 (e.g. Galaxy S26 Ultra, 19.5:9) get a taller stage instead of black
  // bands: the photos grow, and everything at the bottom is anchored to the bottom edge.
  const MAX_H = 1240;
  let scale = 1, stageX = 0, stageY = 0, stageH = 847, baseH = innerHeight;
  function fit() {
    if (editing) return;
    const W = innerWidth, H = innerHeight;
    baseH = H;
    const top = insetEl.offsetHeight ? insetEl.offsetHeight + 6 : 0;
    const u = Math.min(W / 523, H / 847, (H - top) / (847 - 27));
    let y = Math.max(0, top - 27 * u);
    const h = Math.min(Math.max((H - y) / u, 847), MAX_H);
    y = Math.max(y, (H - h * u) / 2);
    const x = (W - 523 * u) / 2;
    stage.style.height = h + "px";
    stage.style.transform = `translate(${x}px, ${y}px) scale(${u})`;
    scale = u; stageX = x; stageY = y; stageH = h;
  }
  addEventListener("resize", () => editing ? onViewport() : fit());
  fit();

  // Caption: grows to 4 lines, then scrolls.
  function sizeCaption() {
    caption.style.height = "auto";
    caption.style.height = Math.min(Math.max(caption.scrollHeight, 78), 156) + "px";
  }
  function setText(t) { caption.value = t; sizeCaption(); }
  caption.addEventListener("input", sizeCaption);
  setText(startText);

  // The device's own keyboard: the page measures where it starts (bottom of the visible area) and sits
  // the caption box 12px above it; the photo shrinks from the bottom, so the header and the top of the
  // photo never move. The keyboard resizes the page (interactive-widget=resizes-content) rather than
  // panning it; if the browser pans anyway, the stage is shifted down by the same amount.
  let keyboardSeen = false;
  function keyboardSpace(visibleTop, visibleBottom) {
    if (!editing) return;
    stage.style.transform = `translate(${stageX}px, ${stageY + visibleTop}px) scale(${scale})`;
    const kb = baseH - visibleBottom + visibleTop;
    if (kb > 80) {
      keyboardSeen = true;
      const below = (stageY + visibleTop + stageH * scale - visibleBottom) / scale;   // stage px hidden by the keyboard
      spacer.style.height = Math.max(36, below + 12) + "px";
    } else if (keyboardSeen) {
      caption.blur();   // keyboard closed with the back gesture: back to the resting post
    }
  }
  function onViewport() {
    scrollTo(0, 0);   // keep the page pinned
    document.documentElement.scrollTop = document.body.scrollTop = 0;
    const vv = window.visualViewport;
    if (vv) keyboardSpace(vv.offsetTop, vv.offsetTop + vv.height);
    else keyboardSpace(0, innerHeight);
  }
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", onViewport);
    visualViewport.addEventListener("scroll", onViewport);
  }

  caption.addEventListener("focus", () => {
    editing = true;
    keyboardSeen = false;
    post.classList.add("editing");
    onViewport();
  });
  caption.addEventListener("blur", () => {
    editing = false;
    keyboardSeen = false;
    spacer.style.height = "";
    post.classList.remove("editing");
    onViewport();
    // Refit now only if the keyboard has already gone; otherwise the resize when it closes refits.
    if (innerHeight > baseH - 80) fit();
    else stage.style.transform = `translate(${stageX}px, ${stageY}px) scale(${scale})`;
  });

  // Tapping anywhere on the grey box starts typing, caret at the end.
  box.addEventListener("pointerdown", e => {
    if (e.target === caption || e.target.closest(".send")) return;
    e.preventDefault();
    caption.focus({ preventScroll: true });
    const n = caption.value.length;
    caption.setSelectionRange(n, n);
  });
  // Hidden button: tapping the username fills in the caption (keeps the keyboard if it's open).
  post.querySelector(".user").addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    setText(STORY_DEFAULT);
    if (editing) caption.setSelectionRange(caption.value.length, caption.value.length);
  });
  // Tapping outside the box while typing closes the keyboard.
  post.addEventListener("pointerdown", e => {
    if (editing && !e.target.closest(".box")) caption.blur();
  });

  const commentList = document.getElementById("comments");
  const heartLayer = document.getElementById("hearts");
  addEventListener("load", () => COMMENTS.forEach(c => { new Image().src = `assets/avatars/${c[2]}.jpg`; }));
  // Fetch the Noto emoji the comments use up front, so none flash in the device's emoji style first.
  if (document.fonts) document.fonts.load('15px "Noto Color Emoji"', COMMENTS.map(c => c[1]).join("")).catch(() => {});

  let order = [], next = 0, commentTimer = 0, heartTimer = 0;
  function addComment() {
    const [user, text, frame] = COMMENTS[order[next++ % order.length]];
    const li = document.createElement("li");
    const img = document.createElement("img");
    img.src = `assets/avatars/${frame}.jpg`; img.alt = "";
    const p = document.createElement("p");
    const b = document.createElement("b");
    b.textContent = user;
    p.append(b, text);
    li.append(img, p);
    commentList.append(li);
    // The list is anchored at the bottom: slide it up by the new row's height.
    const ease = "cubic-bezier(.2,.8,.2,1)";
    commentList.animate([{ transform: `translateY(${li.offsetHeight}px)` }, { transform: "none" }], { duration: 380, easing: ease });
    li.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 380, easing: ease });
    while (commentList.children.length > 6) commentList.firstElementChild.remove();
    commentTimer = setTimeout(addComment, 650 + Math.random() * 750);
  }

  // Floating reactions: Noto Color Emoji images (Google, commercial-safe licence; see assets/emoji/README.txt).
  // File names are the Unicode code points: 😄 😁 😆 😊 🥰 😍 🤩 😎 ❤️ 👏
  const EMOJI = ["1f604", "1f601", "1f606", "1f60a", "1f970", "1f60d", "1f929", "1f60e", "2764", "1f44f"];
  addEventListener("load", () => EMOJI.forEach(c => { new Image().src = `assets/emoji/${c}.png`; }));
  // One emoji: starts small on the like button (428, 49px above the bottom), drifts up the right side with a sway, fades out.
  function floatEmoji() {
    const size = 24 + Math.random() * 16;
    const img = document.createElement("img");
    img.src = `assets/emoji/${EMOJI[Math.floor(Math.random() * EMOJI.length)]}.png`;
    img.alt = "";
    img.width = img.height = size;
    heartLayer.append(img);

    const x0 = 428 - size / 2, y0 = stageH - 57 - size / 2;
    const rise = (360 + Math.random() * 160) * stageH / 847;
    const drift = 20 + Math.random() * 40;
    const sway = 8 + Math.random() * 12, phase = Math.random() * 6.28;
    const tilt = (Math.random() - 0.5) * 30;
    const frames = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const x = x0 + drift * t + sway * Math.sin(phase + t * 7);
      const y = y0 - rise * (1 - Math.pow(1 - t, 1.4));
      const s = t < 0.12 ? 0.3 + 0.7 * (t / 0.12) : 1;
      const o = t < 0.1 ? t / 0.1 : t > 0.7 ? (1 - t) / 0.3 : 1;
      frames.push({ transform: `translate(${x}px, ${y}px) scale(${s}) rotate(${tilt * t}deg)`, opacity: o });
    }
    img.animate(frames, { duration: 2600 + Math.random() * 1400, easing: "linear" }).onfinish = () => img.remove();
  }
  function heartStream() {
    floatEmoji();
    heartTimer = setTimeout(heartStream, 160 + Math.random() * 260);
  }

  function startReactions() {
    stopReactions();
    order = COMMENTS.map((_, i) => i).sort(() => Math.random() - 0.5);   // random order each time
    next = 0;
    commentTimer = setTimeout(addComment, 700);
    heartTimer = setTimeout(heartStream, 500);
  }
  function stopReactions() {
    clearTimeout(commentTimer); clearTimeout(heartTimer);
    commentList.replaceChildren();
    heartLayer.replaceChildren();
  }

  // The device's status bar takes the screen's background colour.
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  function showStory() {
    themeMeta.content = "#141112";
    document.getElementById("storyCaption").textContent = caption.value.trim() || STORY_DEFAULT;
    caption.blur();
    heart.classList.remove("on");
    story.classList.remove("play");
    post.hidden = true;
    story.hidden = false;
    document.body.classList.add("on-story");
    requestAnimationFrame(() => requestAnimationFrame(() => story.classList.add("play")));
    startReactions();
  }
  function showPost() {
    themeMeta.content = "#000000";
    stopReactions();
    story.hidden = true;
    story.classList.remove("play");
    post.hidden = false;
    document.body.classList.remove("on-story");
    setText(startText);   // empty caption for the next take
  }

  const send = document.getElementById("send");
  send.addEventListener("pointerdown", e => e.preventDefault());   // don't drop the keyboard before the tap lands
  send.addEventListener("click", showStory);
  document.getElementById("close").addEventListener("click", showPost);
  heart.addEventListener("click", () => {
    heart.classList.toggle("on");
    for (let i = 0; i < 6; i++) setTimeout(floatEmoji, i * 70);   // a burst on every tap
  });
  addEventListener("keydown", e => { if (e.key === "Escape" && !story.hidden) showPost(); });

  if (q.get("screen") === "story") showStory();
</script>
